<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)" />

  <!-- Waveform pulse rings -->
  <circle cx="256" cy="245" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6" stroke-dasharray="12 12" />
  <circle cx="256" cy="245" r="185" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4" />

  <!-- Diamond Crown on top -->
  <path d="M 216 110 L 256 75 L 296 110 L 280 135 L 232 135 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <polygon points="256,82 240,118 272,118" fill="#fef08a" opacity="0.8" />
  
  <!-- Microphone Capsule -->
  <rect x="216" y="145" width="80" height="135" rx="40" fill="url(#micGrad)" filter="url(#glow)" />
  <!-- Capsule mesh lines -->
  <line x1="222" y1="185" x2="290" y2="185" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <line x1="222" y1="210" x2="290" y2="210" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="150" x2="256" y2="245" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

  <!-- Mic Cradle / Stand U-shape -->
  <path d="M 186 215 C 186 295 326 295 326 215" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
  
  <!-- Mic Pole & Stand Base -->
  <line x1="256" y1="295" x2="256" y2="355" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
  <path d="M 196 355 L 316 355" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />

  <!-- Sound Waves Left & Right -->
  <path d="M 145 200 A 60 60 0 0 0 145 280" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" />
  <path d="M 115 175 A 95 95 0 0 0 115 305" fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" opacity="0.6" />

  <path d="M 367 200 A 60 60 0 0 1 367 280" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" />
  <path d="M 397 175 A 95 95 0 0 1 397 305" fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" opacity="0.6" />

  <!-- AbuChat brand text banner -->
  <rect x="110" y="395" width="292" height="65" rx="24" fill="#020617" fill-opacity="0.85" />
  <text x="256" y="440" font-family="'Plus Jakarta Sans', Outfit, system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">AbuChat</text>
  <circle cx="370" cy="425" r="5" fill="#10b981" />
</svg>
